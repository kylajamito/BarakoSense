<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>BarakoSense Admin Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#8B4513",             // Coffee brown
            "background-light": "#F7F3EE",    // Creamy beige
            "background-dark": "#2B1B12",     // Dark roast
            "surface-light": "#FFFFFF",       // White cup
            "surface-dark": "#3B2A21",        // Mocha
            "text-light": "#2E1F14",          // Espresso text
            "text-dark": "#EFE7DD",           // Latte text
            "text-muted-light": "#8D7B6A",    // Light roast
            "text-muted-dark": "#B9A493",     // Cappuccino foam
            "border-light": "#E6D8C3",        // Light beige border
            "border-dark": "#4A372A"          // Dark coffee border
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
          boxShadow: {
            "xl": "0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04)"
          }
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    body {
      background-image: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1974&q=80');
      background-size: cover;
      background-position: center;
    }
    .backdrop-blur-sm {
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body class="font-display text-text-light dark:text-text-dark bg-background-light dark:bg-background-dark">
  <div class="flex min-h-screen flex-col bg-black/30">

    <!-- MAIN LOGIN SECTION -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
      <div class="w-full max-w-md space-y-8">
        <div class="bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-sm p-8 shadow-xl rounded-xl border border-border-light dark:border-border-dark">

          <!-- Logo + Title -->
          <div class="text-center mb-10">
            <div class="flex justify-center mb-4">
              <div class="w-16 h-16 text-primary">
                <svg fill="currentColor" viewBox="0 0 24 24">
                  <path d="M18 8h1a3 3 0 0 1 0 6h-1v1a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8h15Zm1 4a1 1 0 0 0 0-2h-1v2h1ZM6 19h7a3 3 0 0 0 3-3V8H6v8a3 3 0 0 0 3 3Zm11 2H4a1 1 0 0 1 0-2h13a1 1 0 1 1 0 2Z"/>
                </svg>
              </div>
            </div>
            <h2 class="text-3xl font-bold text-text-light dark:text-text-dark">Admin Portal</h2>
            <p class="mt-2 text-sm text-text-muted-light dark:text-text-muted-dark">Welcome back, please login to your account.</p>
          </div>

          <!-- LOGIN FORM -->
          <form action="#" class="space-y-6" method="POST">
            <div class="space-y-4">
              <div>
                <label class="sr-only" for="username">Username/Email</label>
                <input id="username" name="username" type="text" required placeholder="Username or Email"
                  class="appearance-none block w-full px-4 py-3 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark placeholder-text-muted-light dark:placeholder-text-muted-dark text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary rounded-lg shadow-sm"/>
              </div>
              <div>
                <label class="sr-only" for="password">Password</label>
                <input id="password" name="password" type="password" required placeholder="Password"
                  class="appearance-none block w-full px-4 py-3 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark placeholder-text-muted-light dark:placeholder-text-muted-dark text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary rounded-lg shadow-sm"/>
              </div>
            </div>

            <!-- Forgot Password -->
            <div class="flex items-center justify-end">
              <div class="text-sm">
                <a href="#" class="font-medium text-primary hover:text-primary/80 transition">Forgot Password?</a>
              </div>
            </div>

            <!-- Submit Button -->
            <div>
              <button type="submit"
                class="group relative w-full flex justify-center py-3 px-4 text-base font-bold rounded-lg text-background-dark bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 ease-in-out">
                Login
              </button>
            </div>
          </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-text-muted-light dark:text-text-muted-dark">© 2024 BarakoSense. All Rights Reserved.</p>
      </div>
    </main>
  </div>
  <script src="../../script/login.js"></script>
</body>
</html>
