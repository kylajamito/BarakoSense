<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Logout - BarakoSense</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: {
              DEFAULT: "#8B4513",
              light: "#A0522D",
            },
            beige: "#F9F5F2",
            white: "#FFFFFF",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }

    /* Smooth fade animation for the modal */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out;
    }

    /* Background blur effect */
    body {
      position: relative;
      overflow: hidden;
    }

    #blurBg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.8);
      z-index: 0;
    }
  </style>
</head>

<body class="font-display flex items-center justify-center min-h-screen">

  <!-- Background placeholder (will be replaced dynamically) -->
  <div id="blurBg"></div>

  <!-- Logout Modal -->
  <div class="relative z-10 bg-white p-8 rounded-2xl shadow-lg text-center border border-brown/10 w-80 animate-fadeIn">
    <div class="flex justify-center mb-4">
      <span class="material-symbols-outlined text-brown text-5xl">logout</span>
    </div>
    <h2 class="text-xl font-semibold text-brown mb-2">Confirm Logout</h2>
    <p class="text-sm text-brown/70 mb-6">Are you sure you want to log out from BarakoSense?</p>

    <div class="flex justify-center gap-4">
      <button id="cancelLogout"
        class="px-4 py-2 rounded-lg border border-brown/30 text-brown hover:bg-beige transition">
        Cancel
      </button>
      <button id="confirmLogout"
        class="px-4 py-2 rounded-lg bg-brown text-white hover:bg-brown/80 transition">
        Logout
      </button>
    </div>
  </div>

  <script>
    // Get the blurred background from the previous page
    document.addEventListener("DOMContentLoaded", () => {
      // Use sessionStorage to capture the last page screenshot or color
      const lastBg = sessionStorage.getItem("lastPageBg");
      const blurBg = document.getElementById("blurBg");
      if (lastBg) {
        blurBg.style.backgroundImage = `url(${lastBg})`;
      } else {
        blurBg.style.background = "#F9F5F2"; // fallback beige background
      }
    });

    // Cancel and Confirm actions
    document.getElementById('cancelLogout').addEventListener('click', () => {
      window.history.back();
    });

    document.getElementById('confirmLogout').addEventListener('click', () => {
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
