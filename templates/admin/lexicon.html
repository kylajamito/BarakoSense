<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>BarakoSense - Lexicon Management</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: {
              DEFAULT: "#8B4513",
              light: "#A0522D",
            },
            beige: "#F9F5F2",
            white: "#FFFFFF",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
</head>

<body class="bg-white text-brown font-display">
  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-brown/20 flex-shrink-0">
      <div class="p-6">
        <!-- Logo + Title -->
        <div class="flex items-center gap-3 mb-10">
          <svg class="text-brown h-8 w-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18 8h1a3 3 0 0 1 0 6h-1v1a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8h15Zm1 4a1 1 0 0 0 0-2h-1v2h1ZM6 19h7a3 3 0 0 0 3-3V8H6v8a3 3 0 0 0 3 3Zm11 2H4a1 1 0 0 1 0-2h13a1 1 0 1 1 0 2Z" />
          </svg>
          <div>
            <h1 class="text-lg font-bold text-brown">BarakoSense</h1>
            <p class="text-xs text-brown/70">Admin</p>
          </div>
        </div>

        <!-- Nav Menu -->
        <nav class="space-y-2">
          <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-brown hover:bg-beige transition">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span>Analytics</span>
          </a>

          <a href="history.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-brown hover:bg-beige transition">
            <span class="material-symbols-outlined text-xl">history</span>
            <span>History</span>
          </a>

          <a href="lexicon.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-brown text-white font-semibold">
            <span class="material-symbols-outlined text-xl">book</span>
            <span>Lexicon</span>
          </a>

          <a href="logout.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-brown hover:bg-beige transition">
            <span class="material-symbols-outlined text-xl">logout</span>
            <span>Logout</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col bg-white">
      <!-- HEADER -->
      <header class="bg-white border-b border-brown/10 px-8 py-5 flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-bold text-brown">Lexicon Management Dashboard</h2>
          <p class="text-sm text-brown/60 mt-1">Manage sensory vocabulary for Coffee Liberica</p>
        </div>
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-full bg-brown flex items-center justify-center text-white font-bold">
            A
          </div>
        </div>
      </header>

      <!-- MAIN CONTENT AREA -->
      <main class="flex-1 p-10 bg-white">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

          <!-- ADD TERM -->
          <div class="lg:col-span-1 bg-white border border-brown/10 rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-semibold mb-6 text-brown">Add New Term</h3>
            <form class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-brown/80 mb-1" for="descriptor">Descriptor</label>
                <input id="descriptor" type="text" placeholder="e.g., Floral" class="w-full rounded-lg border border-brown/20 focus:ring-brown focus:border-brown/50 px-3 py-2 text-brown" />
              </div>

              <div>
                <label class="block text-sm font-medium text-brown/80 mb-1" for="category">Category</label>
                <select id="category" class="w-full rounded-lg border border-brown/20 focus:ring-brown focus:border-brown/50 px-3 py-2 text-brown">
                  <option>Select Category</option>
                  <option>Acidity</option>
                  <option>Aftertaste</option>
                  <option>Aroma</option>
                  <option>Flavor</option>
                  <option>Texture</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-brown/80 mb-1" for="definition">Definition</label>
                <textarea id="definition" rows="4" placeholder="e.g., Having the scent of flowers" class="w-full rounded-lg border border-brown/20 focus:ring-brown focus:border-brown/50 px-3 py-2 text-brown"></textarea>
              </div>

              <!-- WORKING INTENSITY SLIDER (1–5) -->
              <div>
                <label class="block text-sm font-medium text-brown/80 mb-1" for="intensity">Intensity</label>
                <div class="flex items-center gap-3">
                  <input id="intensity" type="range" min="1" max="5" value="3" class="w-full accent-brown cursor-pointer" />
                  <span id="intensityValue" class="text-brown font-semibold">3</span>
                </div>
              </div>

              <div class="flex items-center gap-4 pt-2">
                <button type="submit" class="w-full bg-brown text-white font-semibold py-2 px-4 rounded-lg hover:bg-brown/90 transition-colors">Add Term</button>
                <button type="button" class="w-full bg-white border border-brown/20 text-brown font-semibold py-2 px-4 rounded-lg hover:bg-beige transition-colors">Cancel</button>
              </div>
            </form>
          </div>

          <!-- EXISTING TERMS -->
          <div class="lg:col-span-2 bg-white border border-brown/10 rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-semibold mb-6 text-brown">Existing Terms</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left table-fixed" id="lexiconTable">
                <thead>
                  <tr class="border-b border-brown/10">
                    <th class="w-1/5 p-4 text-sm font-semibold text-brown/80">Descriptor</th>
                    <th class="w-1/6 p-4 text-sm font-semibold text-brown/80">Category</th>
                    <th class="w-1/2 p-4 text-sm font-semibold text-brown/80">Definition</th>
                    <th class="w-1/12 p-4 text-sm font-semibold text-brown/80 text-center">Intensity</th>
                    <th class="w-1/6 p-4 text-sm font-semibold text-brown/80 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-brown/10 text-brown/80">
                  <!-- Table rows will be populated by JavaScript -->
                </tbody>
              </table>
            </div>
            
            <!-- Pagination Controls -->
            <div id="paginationControls"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script>
    // Live update for intensity slider (1–5)
    const intensityRange = document.getElementById("intensity");
    const intensityValue = document.getElementById("intensityValue");

    intensityRange.addEventListener("input", () => {
      intensityValue.textContent = intensityRange.value;
    });
  </script>

  <script>
    // Capture visible area before going to logout.html
    document.querySelector('a[href="login.html"]').addEventListener('click', (e) => {
      e.preventDefault();
      html2canvas(document.body).then(canvas => {
        const img = canvas.toDataURL("image/png");
        sessionStorage.setItem("lastPageBg", img);
        window.location.href = "logout.html";
      });
    });
  </script>

  <!-- Add this in your <head> or before </body> -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="../../script/admin-lexicon.js"></script>

</body>
</html>
